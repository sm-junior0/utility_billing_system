spring.application.name=utilitybilling

spring.datasource.url=jdbc:postgresql://localhost:5432/utilitybilling
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:db/constraint-fixes.sql,classpath:db/routines.sql
spring.sql.init.separator=@@
spring.jpa.defer-datasource-initialization=true

app.jwt.secret=${JWT_SECRET:VGhpc0lzQVN0cm9uZ0pXdFNlY3JldEtleUZvclV0aWxpdHlCaWxsaW5nQXBwbGljYXRpb24xMjM0NTY3ODkw}
app.jwt.expiration-ms=86400000
app.default-bill-due-days=15
app.otp.expiration-minutes=10

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:juniormanene@gmail.com}
spring.mail.password=${MAIL_PASSWORD:wmmejaarixbyhydo}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.tags-sorter=definition
springdoc.swagger-ui.operations-sorter=method
springdoc.writer-with-order-by-keys=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.display-request-duration=true

# Pagination defaults for pageable endpoints
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=100

# Application logging (console + file)
logging.level.org.smj.utilitybilling=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=DEBUG
logging.file.name=logs/utilitybilling.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.file-name-pattern=logs/utilitybilling-%d{yyyy-MM-dd}.%i.log
